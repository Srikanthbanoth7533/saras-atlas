services:
  - type: web
    name: saras-atlas-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: ATLAS_JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"

